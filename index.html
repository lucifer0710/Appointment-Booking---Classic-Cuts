<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Cuts | Book Your Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>💈 CLASSIC CUTS</h1>
        <div class="subtitle">Premium Grooming Services</div>
    </header>

    <div class="container">
        <div id="grid" class="grid">
            <div style="grid-column: 1/-1; text-align: center; padding: 40px; background: rgba(0,0,0,0.7); border-radius: 10px; color: white; font-weight: bold;">
                Loading available slots...
            </div>
        </div>
    </div>

    <div id="modal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="modalTitle" class="modal-title">Confirm Booking</h2>
            <div id="modalTime" class="modal-time">10:00 AM</div>
            
            <div id="bookForm">
                <input type="text" id="name" placeholder="Full Name" autocomplete="off">
                <input type="tel" id="phone" placeholder="Phone Number" autocomplete="off">
                <button class="btn btn-primary" onclick="handleBook()">Confirm Appointment</button>
            </div>

            <div id="cancelForm" style="display:none;">
                <p style="color:#a0c4ff; margin-bottom: 20px;">To cancel, please verify your phone number used for booking.</p>
                <input type="tel" id="cancelPhone" placeholder="Enter Phone Number">
                <button class="btn btn-danger" onclick="handleCancel()">Cancel Appointment</button>
            </div>

            <button class="btn btn-close" onclick="closeModal()">Close</button>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
