<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Cuts | Book Your Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Theme Colors */
            --bg-color: #001233;
            --surface-color: #002855;
            
            /* Status Colors */
            --status-green: #00c853; /* Bright Green for Available */
            --status-red: #D62828;   /* Red for Booked */
            
            /* Branding Colors (for background) */
            --brand-blue: #001233;
            --brand-white: #ffffff;
            --brand-red: #D62828;
            
            --text-primary: #ffffff;
            --text-secondary: #a0c4ff;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: var(--text-primary);
            
            /* --- BARBER POLE BACKGROUND (Blue/White/Red) --- */
            background-color: var(--bg-color);
            background-image: repeating-linear-gradient(
                45deg,
                var(--brand-blue) 0px,
                var(--brand-blue) 40px,
                var(--brand-white) 40px,
                var(--brand-white) 50px,
                var(--brand-red) 50px,
                var(--brand-red) 90px,
                var(--brand-white) 90px,
                var(--brand-white) 100px
            );
            background-attachment: fixed;
        }

        /* --- Header --- */
        header {
            text-align: center;
            padding: 40px 20px;
            background: #001830; 
            width: 100%;
            box-sizing: border-box;
            border-bottom: 4px solid var(--brand-white);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        h1 { margin: 0; font-weight: 600; color: var(--brand-white); letter-spacing: 2px; font-size: 2.5rem; text-shadow: 2px 2px 0px var(--status-red); }
        .subtitle { color: var(--text-secondary); margin-top: 10px; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }

        /* --- Grid Layout --- */
        .container {
            width: 100%;
            max-width: 900px;
            padding: 20px;
            box-sizing: border-box;
            margin-top: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
        }

        /* --- Slot Cards --- */
        .slot {
            background: var(--surface-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        
        /* HOVER: Turn Green if available */
        .slot.available:hover { transform: translateY(-5px); border-color: var(--status-green); box-shadow: 0 0 15px rgba(0, 200, 83, 0.4); }
        .slot.booked:hover { transform: translateY(-5px); border-color: var(--status-red); }
        
        .time { font-size: 1.3rem; font-weight: 600; display: block; margin-bottom: 5px; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .status { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }

        /* --- STATUS COLORS --- */
        
        /* AVAILABLE -> GREEN */
        .slot.available { border-bottom: 8px solid var(--status-green); }
        .slot.available .status { color: var(--status-green); }
        
        /* BOOKED -> RED */
        .slot.booked { border-bottom: 8px solid var(--status-red); opacity: 0.85; background: #000c22; }
        .slot.booked .status { color: var(--status-red); }
        
        /* --- Modal (Popup) --- */
        .modal-overlay {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: var(--surface-color);
            padding: 40px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            border: 2px solid white;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            animation: slideUp 0.3s ease;
        }

        .modal-title { color: var(--brand-white); margin-bottom: 5px; }
        .modal-time { font-size: 2rem; font-weight: bold; margin: 10px 0 30px 0; color: white; }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            background: #001233;
            border: 1px solid #04468f;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: 0.2s;
        }
        input:focus { border-color: var(--status-green); box-shadow: 0 0 8px rgba(0, 200, 83, 0.3); }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }
        
        /* Primary Action -> GREEN */
        .btn-primary { background: var(--status-green); color: #000; }
        .btn-primary:hover { background: #00e676; box-shadow: 0 0 15px rgba(0, 200, 83, 0.4); }

        /* Danger Action -> RED */
        .btn-danger { background: transparent; border: 2px solid var(--status-red); color: var(--status-red); }
        .btn-danger:hover { background: var(--status-red); color: white; }

        .btn-close { background: #001233; color: #888; margin-top: 15px; }
        .btn-close:hover { background: #001835; color: white; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(50px); } to { transform: translateY(0); } }

    </style>
</head>
<body>

    <header>
        <h1>💈 CLASSIC CUTS</h1>
        <div class="subtitle">Premium Grooming Services</div>
    </header>

    <div class="container">
        <div id="grid" class="grid">
            <div style="grid-column: 1/-1; text-align: center; padding: 40px; background: rgba(0,0,0,0.7); border-radius: 10px; color: white; font-weight: bold;">
                Loading available slots...
            </div>
        </div>
    </div>

    <div id="modal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="modalTitle" class="modal-title">Confirm Booking</h2>
            <div id="modalTime" class="modal-time">10:00 AM</div>
            
            <div id="bookForm">
                <input type="text" id="name" placeholder="Full Name" autocomplete="off">
                <input type="tel" id="phone" placeholder="Phone Number" autocomplete="off">
                <button class="btn btn-primary" onclick="handleBook()">Confirm Appointment</button>
            </div>

            <div id="cancelForm" style="display:none;">
                <p style="color:#a0c4ff; margin-bottom: 20px;">To cancel, please verify your phone number used for booking.</p>
                <input type="tel" id="cancelPhone" placeholder="Enter Phone Number">
                <button class="btn btn-danger" onclick="handleCancel()">Cancel Appointment</button>
            </div>

            <button class="btn btn-close" onclick="closeModal()">Close</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // --- PASTE YOUR FIREBASE CONFIG HERE ---
const firebaseConfig = {




    
};


        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let selectedTime = '';
        const allSlots = generateSlots();

        function generateSlots() {
            const times = [];
            for (let i = 9; i <= 17; i++) { 
                const period = i >= 12 ? 'PM' : 'AM';
                let hour = i > 12 ? i - 12 : i;
                times.push(`${hour}:00 ${period}`);
                if (i < 17) times.push(`${hour}:30 ${period}`);
            }
            return times;
        }

        const bookingsRef = ref(db, 'bookings');
        onValue(bookingsRef, (snapshot) => {
            const data = snapshot.val() || {};
            renderGrid(data);
        });

        function renderGrid(bookings) {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            allSlots.forEach(time => {
                const slotId = time.replace(/[:\s]/g, ''); 
                const booking = bookings[slotId];
                const isBooked = !!booking;
                
                const div = document.createElement('div');
                div.className = `slot ${isBooked ? 'booked' : 'available'}`;
                
                div.innerHTML = `
                    <span class="time">${time}</span>
                    <span class="status">${isBooked ? 'Booked' : 'Available'}</span>
                `;
                
                div.onclick = () => openModal(time, slotId, isBooked);
                grid.appendChild(div);
            });
        }

        window.openModal = (time, slotId, isBooked) => {
            selectedTime = time;
            window.selectedSlotId = slotId;
            
            const modal = document.getElementById('modal');
            modal.style.display = 'flex';
            document.getElementById('modalTime').innerText = time;

            // Reset inputs
            document.getElementById('name').value = '';
            document.getElementById('phone').value = '';
            document.getElementById('cancelPhone').value = '';

            if (isBooked) {
                document.getElementById('modalTitle').innerText = "Manage Booking";
                document.getElementById('bookForm').style.display = 'none';
                document.getElementById('cancelForm').style.display = 'block';
                document.getElementById('modalTime').style.color = 'var(--status-red)';
            } else {
                document.getElementById('modalTitle').innerText = "New Appointment";
                document.getElementById('bookForm').style.display = 'block';
                document.getElementById('cancelForm').style.display = 'none';
                document.getElementById('modalTime').style.color = 'var(--status-green)';
            }
        };

        window.closeModal = () => { document.getElementById('modal').style.display = 'none'; };

        window.handleBook = async () => {
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            if(!name || !phone) return alert("Please fill in all fields");

            const snapshot = await get(ref(db, 'bookings/' + window.selectedSlotId));
            if (snapshot.exists()) return alert("Slot was just taken by someone else!");

            set(ref(db, 'bookings/' + window.selectedSlotId), {
                name, phone, time: selectedTime
            }).then(() => {
                closeModal();
            }).catch((e) => alert("Error: " + e.message));
        };

        window.handleCancel = async () => {
            const phone = document.getElementById('cancelPhone').value;
            const snapshot = await get(ref(db, 'bookings/' + window.selectedSlotId));
            
            if (!snapshot.exists()) return alert("Booking not found");
            if (snapshot.val().phone !== phone) return alert("Incorrect Phone Number");

            remove(ref(db, 'bookings/' + window.selectedSlotId)).then(() => closeModal());
        };
    </script>
</body>
</html>
