<!DOCTYPE html>
<html lang="en">
<head>
    <title>Barber Admin | Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <!-- Login Overlay -->
    <div id="loginOverlay" class="login-overlay">
        <div class="login-container">
            <h2>💈 Admin Login</h2>
            <input type="email" id="adminEmail" class="login-input" placeholder="Admin Email" autocomplete="username">
            <input type="password" id="adminPassword" class="login-input" placeholder="Password" autocomplete="current-password">
            <button class="btn-login" onclick="handleLogin()">Login</button>
            <div id="loginError" class="login-error"></div>
        </div>
    </div>

    <div class="card-container">
        <div style="padding: 20px; border-bottom: 1px solid #063c75; display: flex; justify-content: space-between; background: #001f3f;">
            <h2 style="color:white; margin:0;">✂️ Dashboard</h2>
            <div style="display: flex; gap: 15px; align-items: center;">
                <div style="color: var(--status-green); font-size: 0.9rem; font-weight: 600;">Live Updates</div>
                <button class="btn-logout" onclick="handleLogout()">Logout</button>
            </div>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>Time</th>
                    <th>Status</th>
                    <th>Client Name</th>
                    <th class="hide-mobile">Phone</th>
                    <th style="text-align: right;">Action</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="5" style="text-align:center; padding: 30px; color: #a0c4ff;">Connecting...</td></tr>
            </tbody>
        </table>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
